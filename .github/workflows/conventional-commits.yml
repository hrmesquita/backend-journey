name: Conventional Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Validate commit subjects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commit headers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pattern='^[a-z][a-z0-9-]*(\([^()]+\))?!?: .+'
          invalid=0

          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Invalid commit subject: $subject"
              invalid=1
            fi
          done < <(git log --no-merges --format='%s' "$BASE_SHA..$HEAD_SHA")

          if [[ "$invalid" -ne 0 ]]; then
            echo "Commit subjects must follow Conventional Commits 1.0.0:"
            echo "https://www.conventionalcommits.org/en/v1.0.0/"
            exit 1
          fi
